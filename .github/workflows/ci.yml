name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  test:
    name: Test (${{ matrix.os }} / Nim)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Start Redis (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y redis-server redis-tools
          sudo systemctl start redis-server
          redis-cli ping

      - name: Start Redis (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
          sleep 2
          redis-cli ping

      - name: Start Redis (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "redis.zip"
          Expand-Archive -Path "redis.zip" -DestinationPath "C:\redis"
          "C:\redis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath "C:\redis\redis-server.exe"
          Start-Sleep -Seconds 2
          & "C:\redis\redis-cli.exe" ping

      - name: Set up Nim via mise
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            nim 2.2.12
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows requires runtime OpenSSL DLLs for HMAC/SHA256 in Nim
      - name: Install Nim Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sSfL --connect-timeout 10 --max-time 30 https://nim-lang.org/download/dlls.zip -o dlls.zip
          New-Item -ItemType Directory -Force -Path "bin"
          Expand-Archive dlls.zip -DestinationPath "bin" -Force
          Expand-Archive dlls.zip -DestinationPath "$env:GITHUB_WORKSPACE\nim-dlls" -Force
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\nim-dlls"

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v
          which nimble
          nimble -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: scripts/ci/install-deps.sh

      - name: Verify rule files in sync with AGENTS.md
        run: python scripts/compile_rules.py --check

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run test suite
        env:
          RHIZO_REDIS_URL: redis://127.0.0.1:6379
          PYTHONUTF8: "1"
        run: scripts/ci/test.sh

  auto-tag:
    name: Auto-Tag on Version Bump
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check version and create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG="v$PKG_VER"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on repository, skipping."
          else
            echo "New version $PKG_VER detected without git tag. Creating tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            gh workflow run release.yml --ref "$TAG" || true
          fi

