name: LLM CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM Model to test with on OpenRouter (e.g. deepseek/deepseek-chat or nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free)'
        required: false
        default: 'deepseek/deepseek-chat'

jobs:
  llm-integration:
    name: LLM Integration Tests (OpenRouter)
    runs-on: ubuntu-latest
    environment: llm-ci

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y redis-tools
          redis-cli ping

      - name: Set up Nim via mise
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            nim 2.2.12
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Nim compiler
        run: |
          which nim
          nim -v

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . "skilz>=0.1.0"

      - name: Compile native Nim binary
        run: scripts/ci/build.sh

      - name: Run LLM Integration Tests
        env:
          RHIZO_REDIS_URL: redis://127.0.0.1:6379
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}

        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::notice ::LLM_API_KEY secret is not present in this runner environment. Skipping LLM integration tests."
            exit 0
          fi
          export LLM_MODEL="${LLM_MODEL:-deepseek/deepseek-chat}"
          python -m pytest -v -m llm -s

