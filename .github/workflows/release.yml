name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build & Verify Linux Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag
        id: vars
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" == "$GITHUB_REF" ]]; then
            VERSION="0.1.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Rhizo version ${VERSION}"

      - name: Set up Nim via mise
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            nim 2.2.12
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim dependencies
        run: |
          nimble install -y --depsOnly

      - name: Install cross-compilation toolchains & QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross qemu-user-static curl
          mkdir -p /tmp/arm64-ssl
          PKG=$(curl -sL https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/ | grep -o 'href="libssl3[^"]*arm64\.deb"' | tr -d '"' | sed 's/href=//' | grep 'noble' | head -n 1 || true)
          if [ -z "$PKG" ]; then
            PKG=$(curl -sL https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/ | grep -o 'href="libssl3[^"]*arm64\.deb"' | tr -d '"' | sed 's/href=//' | head -n 1)
          fi
          echo "Installing arm64 OpenSSL library: ${PKG}"
          curl -sLo /tmp/arm64-ssl/libssl.deb "https://ports.ubuntu.com/ubuntu-ports/pool/main/o/openssl/${PKG}"
          dpkg-deb -x /tmp/arm64-ssl/libssl.deb /tmp/arm64-ssl/extracted
          sudo cp -d -r /tmp/arm64-ssl/extracted/usr/lib/aarch64-linux-gnu/* /usr/aarch64-linux-gnu/lib/ 2>/dev/null || true
          sudo cp -d -r /tmp/arm64-ssl/extracted/lib/aarch64-linux-gnu/* /usr/aarch64-linux-gnu/lib/ 2>/dev/null || true
          sudo ln -sf libcrypto.so.3 /usr/aarch64-linux-gnu/lib/libcrypto.so 2>/dev/null || true

      - name: Compile Linux x86_64 binary
        run: |
          mkdir -p dist/linux-amd64
          nim c -d:release --opt:speed -o:dist/linux-amd64/rhizo src/rhizo.nim
          strip dist/linux-amd64/rhizo
          cp -r skills dist/linux-amd64/
          tar -czf dist/rhizo-linux-amd64.tar.gz -C dist/linux-amd64 rhizo skills

      - name: Compile Linux aarch64 binary
        run: |
          mkdir -p dist/linux-arm64
          nim c -d:release --opt:speed --cpu:arm64 --os:linux \
            --gcc.exe:aarch64-linux-gnu-gcc --gcc.linkerexe:aarch64-linux-gnu-gcc \
            -o:dist/linux-arm64/rhizo src/rhizo.nim
          aarch64-linux-gnu-strip dist/linux-arm64/rhizo
          cp -r skills dist/linux-arm64/
          tar -czf dist/rhizo-linux-arm64.tar.gz -C dist/linux-arm64 rhizo skills

      - name: Build Debian packages (.deb)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # Build amd64 .deb
          mkdir -p deb-amd64/DEBIAN deb-amd64/usr/bin deb-amd64/usr/share/doc/rhizo deb-amd64/usr/share/rhizo/skills
          cp dist/linux-amd64/rhizo deb-amd64/usr/bin/
          # ln -sf rhizo deb-amd64/usr/bin/rhizo
          # ln -sf rhizo deb-amd64/usr/bin/rhizoti
          cp LICENSE deb-amd64/usr/share/doc/rhizo/copyright
          cp README.md deb-amd64/usr/share/doc/rhizo/
          cp -r skills/rhizo deb-amd64/usr/share/rhizo/skills/
          chmod 755 deb-amd64/usr/bin/rhizo
          printf "%s\n" \
            "Package: rhizo" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Axiomantic <info@axiomantic.org>" \
            "Description: Message exchange and routing for software agents over Redis" \
            " Standalone CLI client for inter-agent communication using Redis data" \
            " structures without an intermediate background daemon. Includes HMAC-SHA256" \
            " authentication, dead-agent pruning, and optional AES-256-CBC encryption." \
            > deb-amd64/DEBIAN/control
          printf "%s\n" \
            "#!/bin/sh" \
            "set -e" \
            "if [ \"\$1\" = \"configure\" ]; then" \
            "  echo \"--------------------------------------------------------------------------------\"" \
            "  echo \"Rhizo installed successfully!\"" \
            "  echo \"To equip your AI coding assistants (Claude Code, Antigravity, OpenCode, Cursor):\"" \
            "  echo \"  npx skills add /usr/share/rhizo/skills/rhizo -g\"" \
            "  echo \"  # Or using skilz:\"" \
            "  echo \"  skilz install -f /usr/share/rhizo/skills/rhizo\"" \
            "  echo \"--------------------------------------------------------------------------------\"" \
            "fi" \
            "exit 0" \
            > deb-amd64/DEBIAN/postinst
          chmod 755 deb-amd64/DEBIAN/postinst
          dpkg-deb --build deb-amd64 dist/rhizo_${VERSION}_amd64.deb

          # Build arm64 .deb
          mkdir -p deb-arm64/DEBIAN deb-arm64/usr/bin deb-arm64/usr/share/doc/rhizo deb-arm64/usr/share/rhizo/skills
          cp dist/linux-arm64/rhizo deb-arm64/usr/bin/
          # ln -sf rhizo deb-arm64/usr/bin/rhizo
          # ln -sf rhizo deb-arm64/usr/bin/rhizoti
          cp LICENSE deb-arm64/usr/share/doc/rhizo/copyright
          cp README.md deb-arm64/usr/share/doc/rhizo/
          cp -r skills/rhizo deb-arm64/usr/share/rhizo/skills/
          chmod 755 deb-arm64/usr/bin/rhizo
          printf "%s\n" \
            "Package: rhizo" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: arm64" \
            "Maintainer: Axiomantic <info@axiomantic.org>" \
            "Description: Message exchange and routing for software agents over Redis" \
            " Standalone CLI client for inter-agent communication using Redis data" \
            " structures without an intermediate background daemon. Includes HMAC-SHA256" \
            " authentication, dead-agent pruning, and optional AES-256-CBC encryption." \
            > deb-arm64/DEBIAN/control
          printf "%s\n" \
            "#!/bin/sh" \
            "set -e" \
            "if [ \"\$1\" = \"configure\" ]; then" \
            "  echo \"--------------------------------------------------------------------------------\"" \
            "  echo \"Rhizo installed successfully!\"" \
            "  echo \"To equip your AI coding assistants (Claude Code, Antigravity, OpenCode, Cursor):\"" \
            "  echo \"  npx skills add /usr/share/rhizo/skills/rhizo -g\"" \
            "  echo \"  # Or using skilz:\"" \
            "  echo \"  skilz install -f /usr/share/rhizo/skills/rhizo\"" \
            "  echo \"--------------------------------------------------------------------------------\"" \
            "fi" \
            "exit 0" \
            > deb-arm64/DEBIAN/postinst
          chmod 755 deb-arm64/DEBIAN/postinst
          dpkg-deb --build deb-arm64 dist/rhizo_${VERSION}_arm64.deb

      - name: Verify Linux packages in clean environment
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          echo "=== [1/4] Verifying Linux amd64 tarball ==="
          mkdir -p /tmp/clean-tar-amd64
          tar -xzf dist/rhizo-linux-amd64.tar.gz -C /tmp/clean-tar-amd64
          /tmp/clean-tar-amd64/rhizo --help | grep -F "Nim Native"
          KEY1=$(/tmp/clean-tar-amd64/rhizo get-secret)
          test -n "$KEY1"
          test -f /tmp/clean-tar-amd64/skills/rhizo/SKILL.md

          echo "=== [2/4] Verifying Linux amd64 .deb package installation & uninstallation ==="
          sudo dpkg -i dist/rhizo_${VERSION}_amd64.deb
          (cd /tmp && rhizo --help | grep -F "Nim Native")
          KEY2=$(cd /tmp && rhizo get-secret)
          test -n "$KEY2"
          test -f /usr/share/rhizo/skills/rhizo/SKILL.md
          sudo dpkg -r rhizo
          if which rhizo 2>/dev/null; then
            echo "Error: rhizo should have been uninstalled"
            exit 1
          fi
          test ! -f /usr/share/rhizo/skills/rhizo/SKILL.md

          echo "=== [3/4] Verifying Linux arm64 tarball under QEMU ==="
          mkdir -p /tmp/clean-tar-arm64
          tar -xzf dist/rhizo-linux-arm64.tar.gz -C /tmp/clean-tar-arm64
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-tar-arm64/rhizo --help | grep -F "Nim Native"
          KEY3=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-tar-arm64/rhizo get-secret)
          test -n "$KEY3"
          test -f /tmp/clean-tar-arm64/skills/rhizo/SKILL.md

          echo "=== [4/4] Verifying Linux arm64 .deb extraction under QEMU ==="
          mkdir -p /tmp/clean-deb-arm64
          dpkg-deb -x dist/rhizo_${VERSION}_arm64.deb /tmp/clean-deb-arm64
          qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-deb-arm64/usr/bin/rhizo --help | grep -F "Nim Native"
          KEY4=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/clean-deb-arm64/usr/bin/rhizo get-secret)
          test -n "$KEY4"
          test -f /tmp/clean-deb-arm64/usr/share/rhizo/skills/rhizo/SKILL.md

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: |
            dist/rhizo-linux-amd64.tar.gz
            dist/rhizo-linux-arm64.tar.gz
            dist/*.deb

  build-macos:
    name: Build & Verify macOS Packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim via mise
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            nim 2.2.12
          cache: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim dependencies
        run: |
          nimble install -y --depsOnly

      - name: Compile macOS Apple Silicon (arm64) binary
        run: |
          mkdir -p dist/darwin-arm64
          nim c -d:release --opt:speed --cpu:arm64 -o:dist/darwin-arm64/rhizo src/rhizo.nim
          strip dist/darwin-arm64/rhizo
          codesign -s - -f dist/darwin-arm64/rhizo
          cp -r skills dist/darwin-arm64/
          tar -czf dist/rhizo-darwin-arm64.tar.gz -C dist/darwin-arm64 rhizo skills

      - name: Compile macOS Intel (x86_64) binary
        run: |
          mkdir -p dist/darwin-amd64
          nim c -d:release --opt:speed --cpu:amd64 \
            --passC:"-target x86_64-apple-macos11" \
            --passL:"-target x86_64-apple-macos11" \
            -o:dist/darwin-amd64/rhizo src/rhizo.nim
          strip dist/darwin-amd64/rhizo
          codesign -s - -f dist/darwin-amd64/rhizo
          cp -r skills dist/darwin-amd64/
          tar -czf dist/rhizo-darwin-amd64.tar.gz -C dist/darwin-amd64 rhizo skills

      - name: Verify macOS packages in clean environment
        run: |
          echo "=== [1/2] Verifying macOS arm64 tarball ==="
          mkdir -p /tmp/clean-darwin-arm64
          tar -xzf dist/rhizo-darwin-arm64.tar.gz -C /tmp/clean-darwin-arm64
          /tmp/clean-darwin-arm64/rhizo --help | grep -F "Nim Native"
          KEY1=$(/tmp/clean-darwin-arm64/rhizo get-secret)
          test -n "$KEY1"
          test -f /tmp/clean-darwin-arm64/skills/rhizo/SKILL.md

          echo "=== [2/2] Verifying macOS amd64 tarball ==="
          mkdir -p /tmp/clean-darwin-amd64
          tar -xzf dist/rhizo-darwin-amd64.tar.gz -C /tmp/clean-darwin-amd64
          file /tmp/clean-darwin-amd64/rhizo | grep -q "x86_64"
          test -f /tmp/clean-darwin-amd64/skills/rhizo/SKILL.md
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 /tmp/clean-darwin-amd64/rhizo --help | grep -F "Nim Native"
            KEY2=$(arch -x86_64 /tmp/clean-darwin-amd64/rhizo get-secret)
            test -n "$KEY2"
          else
            echo "Rosetta 2 not available on runner; verified Mach-O x86_64 via file utility"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-assets
          path: |
            dist/rhizo-darwin-arm64.tar.gz
            dist/rhizo-darwin-amd64.tar.gz

  build-windows:
    name: Build & Verify Windows Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim compiler
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up official Nimble & DLLs
        uses: nim-lang/setup-nimble-action@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim dependencies
        shell: cmd
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true
          nimble install -y --depsOnly || verify >nul

      - name: Compile native Windows binary
        shell: powershell
        run: |
          nimble build -y -d:release
          New-Item -ItemType Directory -Force -Path dist\windows-amd64
          Copy-Item -Force bin\rhizo.exe dist\windows-amd64\rhizo.exe
          Copy-Item -Recurse -Force skills dist\windows-amd64\skills
          Compress-Archive -Path dist\windows-amd64\* -DestinationPath dist\rhizo-windows-amd64.zip -Force

      - name: Verify Windows zip package in clean environment
        shell: powershell
        run: |
          Write-Host "=== [1/2] Verifying Windows zip in clean directory ==="
          Expand-Archive -Path "dist/rhizo-windows-amd64.zip" -DestinationPath "C:\clean-rhizo-test" -Force
          $helpOutput = & "C:\clean-rhizo-test\rhizo.exe" --help
          Write-Host $helpOutput
          if (-not ($helpOutput -match "Nim Native")) {
            throw "rhizo.exe --help failed verification"
          }
          $secretOutput = & "C:\clean-rhizo-test\rhizo.exe" get-secret
          Write-Host "Secret: $secretOutput"
          if ([string]::IsNullOrWhiteSpace($secretOutput)) {
            throw "rhizo.exe get-secret failed verification"
          }
          if (-not (Test-Path "C:\clean-rhizo-test\skills\rhizo\SKILL.md")) {
            throw "rhizo-windows-amd64.zip missing skills\rhizo\SKILL.md"
          }

          Write-Host "=== [2/2] Validating Scoop manifest schema ==="
          $scoopManifest = Get-Content -Raw "packaging/scoop/rhizo.json" | ConvertFrom-Json
          if ($scoopManifest.architecture."64bit".bin -ne "rhizo.exe") {
            throw "Invalid Scoop manifest binary target"
          }
          if (-not $scoopManifest.post_install) {
            throw "Scoop manifest missing post_install hook"
          }
          Write-Host "Scoop manifest syntax verified successfully."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-assets
          path: |
            dist/rhizo-windows-amd64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 Checksums
        run: |
          cd release-assets
          sha256sum rhizo-* *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import re, sys
          ver = '${GITHUB_REF#refs/tags/v}'
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              m = re.search(r'## \[?' + re.escape(ver) + r'\]?[^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL)
              notes = m.group(1).strip() if m else ''
          except Exception:
              notes = ''
          if not notes:
              notes = f'Release v{ver}'
          with open('RELEASE_NOTES.md', 'w') as out:
              out.write(notes + '\n')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Deploy APT repository to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p apt-output
          python3 scripts/generate_apt_repo.py release-assets apt-output
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-branch
          mkdir -p gh-pages-branch/apt
          cp -r apt-output/* gh-pages-branch/apt/
          cp apt-output/index.html gh-pages-branch/index.html
          touch gh-pages-branch/.nojekyll
          cd gh-pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): update APT repo with ${GITHUB_REF#refs/tags/} packages" || true
          git push origin gh-pages

      - name: Update Homebrew Tap Formula
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/axiomantic/homebrew-tap.git homebrew-tap-clone || {
            echo "Notice: Could not authenticate to axiomantic/homebrew-tap with default token; please ensure HOMEBREW_TAP_TOKEN secret is configured for cross-repo push."
            exit 0
          }
          ./scripts/update-homebrew-tap.sh "${VERSION}" release-assets || true

  publish-npm:
    name: Publish to npm (OIDC)
    needs: [publish-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Check if already published on npm
        id: npm-check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} is already published on npm. Skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${VERSION} is not yet published. Proceeding..."
          fi

      - name: Download all release artifacts
        if: steps.npm-check.outputs.already_published == 'false'
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble fat-package binaries
        if: steps.npm-check.outputs.already_published == 'false'
        run: |
          mkdir -p bin/binaries
          PKG_NAME=$(node -p "require('./package.json').name.replace('@axiomantic/', '')")

          # Extract Linux x64
          mkdir -p /tmp/lin64
          tar -xzf release-assets/${PKG_NAME}-linux-amd64.tar.gz -C /tmp/lin64
          cp /tmp/lin64/${PKG_NAME} bin/binaries/${PKG_NAME}-linux-x64

          # Extract Linux arm64
          mkdir -p /tmp/linarm
          tar -xzf release-assets/${PKG_NAME}-linux-arm64.tar.gz -C /tmp/linarm
          cp /tmp/linarm/${PKG_NAME} bin/binaries/${PKG_NAME}-linux-arm64

          # Extract macOS arm64
          mkdir -p /tmp/macarm
          tar -xzf release-assets/${PKG_NAME}-darwin-arm64.tar.gz -C /tmp/macarm
          cp /tmp/macarm/${PKG_NAME} bin/binaries/${PKG_NAME}-darwin-arm64

          # Extract macOS x64
          mkdir -p /tmp/macx64
          tar -xzf release-assets/${PKG_NAME}-darwin-amd64.tar.gz -C /tmp/macx64
          cp /tmp/macx64/${PKG_NAME} bin/binaries/${PKG_NAME}-darwin-x64

          # Extract Windows x64
          mkdir -p /tmp/win
          unzip -o release-assets/${PKG_NAME}-windows-amd64.zip -d /tmp/win || true
          cp /tmp/win/${PKG_NAME}.exe bin/binaries/${PKG_NAME}-win32-x64.exe
          test -f bin/binaries/${PKG_NAME}-win32-x64.exe

          chmod 755 bin/binaries/* bin/run.js
          echo "Assembled fat-package binaries in bin/binaries/:"
          ls -lh bin/binaries/

      - name: Prepare npm package files
        if: steps.npm-check.outputs.already_published == 'false'
        run: |
          rm -f bin/rhizo bin/rhizo.exe
          chmod 755 bin/run.js

      - name: Publish to npm via OIDC
        if: steps.npm-check.outputs.already_published == 'false'
        run: npm publish --provenance

